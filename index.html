<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solvency Treasurehunt 2026</title>
  <style>
    :root {
      --bg: #07111d;
      --panel: rgba(8, 15, 28, 0.78);
      --border: rgba(255,255,255,0.14);
      --text: #eef6ff;
      --muted: #aac0d7;
      --accent: #79d8ff;
      --accent-2: #ffe671;
      --danger: #ff8f8f;
      --success: #98ffb4;
      --shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* LOGIN SCREEN */
    #loginScreen {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(121,216,255,0.12), transparent 22%),
        radial-gradient(circle at 80% 15%, rgba(255,230,113,0.1), transparent 20%),
        linear-gradient(135deg, #040812 0%, #0a1730 45%, #09111d 100%);
      padding: 20px;
    }

    .login-card {
      width: min(92vw, 420px);
      padding: 28px;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .brand {
      font-size: clamp(1.2rem, 2vw, 1.5rem);
      font-weight: 800;
      letter-spacing: 0.03em;
      margin: 0 0 6px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.96rem;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #dbe9f6;
      font-weight: 600;
    }

    input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    input:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.08);
      transform: translateY(-1px);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #03111b;
      background: linear-gradient(135deg, var(--accent), #a0ecff);
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
      touch-action: manipulation;
    }

    .btn:hover, .btn:focus-visible {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .error {
      min-height: 22px;
      margin-top: 12px;
      color: var(--danger);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .hint {
      margin-top: 16px;
      color: rgba(255,255,255,0.45);
      font-size: 0.8rem;
      text-align: center;
    }

    /* TREASURE SCREEN */
    #treasureScreen {
      display: none;
      background:
        radial-gradient(circle at 78% 18%, rgba(255,236,150,0.18), transparent 18%),
        linear-gradient(180deg, #0a1117 0%, #0e151d 38%, #111821 100%);
      overflow: hidden;
    }

    .ambient-glow,
    .speed-lines,
    .car-wrap,
    .coords-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 5;
    }

    .coords {
      max-width: min(92vw, 900px);
      padding: 18px 24px;
      border-radius: 24px;
      background: rgba(5, 12, 22, 0.46);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 18px 48px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-align: center;
    }

    .coords .label {
      font-size: clamp(0.9rem, 2vw, 1rem);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #d9edf8;
      opacity: 0.92;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .coords .value {
      font-size: clamp(1.4rem, 4vw, 2.8rem);
      line-height: 1.25;
      font-weight: 900;
      color: #fff8b8;
      text-shadow: 0 0 18px rgba(255,230,113,0.45);
      word-break: break-word;
    }

    .coords .sub {
      margin-top: 10px;
      color: #d5e8f6;
      font-size: clamp(0.88rem, 2vw, 1rem);
      letter-spacing: 0.03em;
    }

    .car-wrap {
      z-index: 3;
      overflow: hidden;
    }

    .car {
      position: absolute;
      bottom: 14%;
      left: -52vw;
      width: min(72vw, 720px);
      aspect-ratio: 3.2 / 1.1;
      animation: arrive 6.5s cubic-bezier(.2,.78,.2,1) infinite;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,0.62));
    }

    .car svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .headlight {
      animation: flicker 1.4s ease-in-out infinite;
      transform-origin: center;
    }

    .road-sheen {
      position: absolute;
      bottom: 10%;
      left: 0;
      right: 0;
      height: 16%;
      background:
        linear-gradient(to top, rgba(0,0,0,0.45), transparent 70%),
        linear-gradient(to right, transparent 0%, rgba(255,255,255,0.05) 30%, rgba(255,255,255,0.02) 60%, transparent 100%);
      opacity: 0.9;
    }

    .logout {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: 14px;
      z-index: 6;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(10, 18, 28, 0.55);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      font-weight: 700;
      pointer-events: auto;
    }

    .corner-badge {
      position: absolute;
      left: 14px;
      top: max(14px, env(safe-area-inset-top));
      z-index: 6;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(10, 18, 28, 0.48);
      color: #ebf7ff;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    @keyframes arrive {
      0%   { transform: translateX(0) scale(0.9); opacity: 0; }
      10%  { opacity: 1; }
      42%  { transform: translateX(72vw) scale(1.02); opacity: 1; }
      56%  { transform: translateX(78vw) scale(1.03); opacity: 1; }
      70%  { transform: translateX(83vw) scale(1.03); opacity: 1; }
      100% { transform: translateX(130vw) scale(1.05); opacity: 0; }
    }
      12%  { opacity: 1; }
      42%  { transform: translateX(63vw) scale(1); opacity: 1; }
      58%  { transform: translateX(67vw) scale(1.02); opacity: 1; }
      78%  { transform: translateX(66vw) scale(1.01); opacity: 1; }
      100% { transform: translateX(120vw) scale(1.05); opacity: 0; }
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.7; filter: blur(1px); }
      50% { opacity: 1; filter: blur(0px); }
    }

    @keyframes streak {
      0% { transform: translateX(-8%); opacity: 0; }
      15% { opacity: 0.6; }
      100% { transform: translateX(8%); opacity: 0; }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.72; }
      50% { transform: scale(1.06); opacity: 0.92; }
    }
      50% { transform: scale(1.05); opacity: 0.92; }
    }

    @media (max-width: 768px) {
      .login-card {
        padding: 22px;
        border-radius: 20px;
      }

      .coords {
        padding: 16px 16px;
        border-radius: 20px;
      }

      .car {
        width: 98vw;
        bottom: 16%;
        left: -68vw;
      }

      @keyframes arrive {
        0%   { transform: translateX(0) scale(0.9); opacity: 0; }
        10%  { opacity: 1; }
        48%  { transform: translateX(86vw) scale(1.02); opacity: 1; }
        66%  { transform: translateX(94vw) scale(1.03); opacity: 1; }
        100% { transform: translateX(155vw) scale(1.05); opacity: 0; }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main id="loginScreen" class="screen" aria-label="Login screen">
    <section class="login-card" aria-labelledby="loginTitle">
      <h1 class="brand" id="loginTitle">solvencytreasurehunt2026.com</h1>
      <p class="subtitle">Enter the correct username and password to access the hidden coordinates.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter username" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required />
        </div>

        <button class="btn" type="submit">Enter</button>
        <div class="error" id="errorMessage" aria-live="polite"></div>
      </form>

      <div class="hint">Protected access only</div>
    </section>
  </main>

  <section id="treasureScreen" class="screen" aria-label="Treasure location screen">
    <div class="ambient-glow"></div>
    <div class="speed-lines"></div>
    <div class="road-sheen"></div>

    <div class="corner-badge">Treasure Hunt 2026</div>
    <button class="logout" id="logoutBtn" type="button" aria-label="Log out">Log out</button>

  <div style="position:fixed; inset:0; z-index:0; overflow:hidden;">
    <img src="PAS_2016_Performance4_Lotus_05_large.jpg"
         alt="Tuned Lotus Elise"
         style="width:100%; height:100%; object-fit:cover; filter:brightness(0.6) contrast(1.1);" />
  </div>

    <div class="coords-wrap" style="position:relative; z-index:5;">
      <div class="coords">
        <div class="label">Coordinates</div>
        <div class="value">N47,4998855, E19,0659131</div>
        <div class="sub">Destination unlocked</div>
      </div>
    </div>
  </section>

  <script>
    const VALID_USERNAME = 'xtreasurehunterx';
    const VALID_PASSWORD = 'wefounditnextnextnext';

    const loginScreen = document.getElementById('loginScreen');
    const treasureScreen = document.getElementById('treasureScreen');
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const logoutBtn = document.getElementById('logoutBtn');

    function showTreasure() {
      loginScreen.style.display = 'none';
      treasureScreen.style.display = 'block';
    }

    function showLogin() {
      treasureScreen.style.display = 'none';
      loginScreen.style.display = 'grid';
      loginForm.reset();
      errorMessage.textContent = '';
      usernameInput.focus();
    }

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (username === VALID_USERNAME && password === VALID_PASSWORD) {
        errorMessage.style.color = 'var(--success)';
        errorMessage.textContent = 'Access granted.';
        setTimeout(() => {
          errorMessage.textContent = '';
          errorMessage.style.color = 'var(--danger)';
          showTreasure();
        }, 350);
      } else {
        errorMessage.style.color = 'var(--danger)';
        errorMessage.textContent = 'Incorrect username or password.';
      }
    });

    logoutBtn.addEventListener('click', showLogin);

    usernameInput.focus();
  </script>
</body>
</html>
